<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="presentation">
<!--
  DIAL ONLY — background watermark. Mark-less, text-less, no lockup.
  Same geometry as the horizontal lockup so the two read as one system.
-->
<defs>
  <linearGradient id="d-ring" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#1c5f57"/><stop offset="1" stop-color="#4fd6c1"/>
  </linearGradient>
  <linearGradient id="d-thread" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#1c5f57" stop-opacity="0.55"/>
    <stop offset="0.4" stop-color="#2f9e8f"/>
    <stop offset="1" stop-color="#7defd8"/>
  </linearGradient>
  <marker id="d-arrow-light" markerWidth="4.2" markerHeight="4.2"
          refX="5.6" refY="3" orient="auto-start-reverse"
          markerUnits="strokeWidth" viewBox="0 0 6 6">
    <path d="M0,0 L0,6 L6,3 z" fill="#7defd8"/>
  </marker>
  <marker id="d-arrow-dark" markerWidth="4.2" markerHeight="4.2"
          refX="5.6" refY="3" orient="auto-start-reverse"
          markerUnits="strokeWidth" viewBox="0 0 6 6">
    <path d="M0,0 L0,6 L6,3 z" fill="#2f9e8f"/>
  </marker>
</defs>

